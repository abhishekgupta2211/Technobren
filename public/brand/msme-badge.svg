<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
  <!-- Outer Badge Container -->
  <rect x="5" y="5" width="390" height="120" rx="16" fill="#ffffff" stroke="#16151a" stroke-width="2" opacity="0.1"/>
  
  <!-- Emblem Circle -->
  <circle cx="65" cy="65" r="42" fill="#003366"/>
  <circle cx="65" cy="65" r="38" fill="none" stroke="#FF9933" stroke-width="2"/>
  
  <!-- Indian Ashoka Chakra / Sun Ray Lines -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.85">
    <line x1="65" y1="30" x2="65" y2="100"/>
    <line x1="30" y1="65" x2="100" y2="65"/>
    <line x1="40" y1="40" x2="90" y2="90"/>
    <line x1="40" y1="90" x2="90" y2="40"/>
  </g>
  <circle cx="65" cy="65" r="14" fill="#003366" stroke="#ffffff" stroke-width="2"/>
  <circle cx="65" cy="65" r="5" fill="#FF9933"/>

  <!-- Text Section -->
  <!-- Govt Tricolor Line Accent -->
  <rect x="125" y="32" width="250" height="3" fill="#FF9933"/>
  <rect x="125" y="35" width="250" height="3" fill="#ffffff"/>
  <rect x="125" y="38" width="250" height="3" fill="#138808"/>

  <text x="125" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#003366" letter-spacing="1">MSME</text>
  <text x="125" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ae3135" letter-spacing="0.5">REGISTERED ENTERPRISE</text>
  <text x="125" y="96" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#57565c">Govt. of India &bull; Reg. Enterprise</text>
</svg>
